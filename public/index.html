<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>云端数据库</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <ellipse cx="12" cy="5" rx="8" ry="3"></ellipse>
            <path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"></path>
            <path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"></path>
          </svg>
        </div>
        <div class="brand-text">
          <h1>云端数据库</h1>
          <p>Cloud Database</p>
        </div>
      </div>

      <div class="side-label">
        <span>数据表</span>
        <span id="tableCount" class="count">0</span>
      </div>
      <nav id="tableList" class="table-list"></nav>
      <button id="newTableBtn" class="new-table">＋ 新建数据表</button>

      <div class="side-footer">
        <div class="backup-row">
          <button id="exportBtn" class="mini">导出备份</button>
          <button id="importBtn" class="mini">导入备份</button>
          <input type="file" id="importFile" accept="application/json,.json" hidden />
        </div>
        <p class="hint">数据保存在云实例磁盘上</p>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="title-block">
          <h2 id="tableTitle">选择一个数据表</h2>
          <p id="tableMeta">从左侧选择一个数据表，或新建一个</p>
        </div>
        <div class="actions">
          <div class="search-box">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="m20 20-3.5-3.5"></path>
            </svg>
            <input id="searchInput" type="text" placeholder="搜索记录…" autocomplete="off" />
          </div>
          <button id="addColumnBtn" class="btn ghost" disabled>新增字段</button>
          <button id="addRowBtn" class="btn primary" disabled>＋ 新增记录</button>
          <button id="dropTableBtn" class="btn danger" disabled>删除表</button>
        </div>
      </header>

      <section class="content">
        <div id="emptyState" class="empty-state">
          <div class="empty-icon">
            <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6">
              <ellipse cx="12" cy="5" rx="8" ry="3"></ellipse>
              <path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"></path>
              <path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"></path>
            </svg>
          </div>
          <h3>还没有选中数据表</h3>
          <p>在左侧选择一张表，或点击「新建数据表」开始</p>
        </div>
        <div id="tableWrap" class="table-card" hidden>
          <div class="table-scroll">
            <table id="dataTable">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
          <div id="noResult" class="no-result" hidden>没有匹配的记录</div>
        </div>
      </section>

      <footer class="statusbar">
        <span class="status-dot"></span>
        <span id="statusText">正在加载…</span>
      </footer>
    </main>
  </div>

  <div id="overlay" class="overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3 id="modalTitle"></h3>
        <button id="modalClose" class="icon-btn" aria-label="关闭">✕</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
      <div class="modal-actions">
        <button id="modalCancel" class="btn ghost">取消</button>
        <button id="modalOk" class="btn primary">保存</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
